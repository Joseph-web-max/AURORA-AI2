<style>

*{box-sizing:border-box}html,body{height:100%;margin:0}body{font:14px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}
.app{height:100%;display:flex;overflow:hidden}.sidebar{width:260px;flex:0 0 260px;background:var(--sidebar);display:flex;flex-direction:column;padding:12px;transition:width .2s,flex-basis .2s;z-index:5}.sidebar.collapsed{width:0;flex-basis:0;padding:0;overflow:hidden}.side-top{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 18px}.brand{display:flex;align-items:center;gap:9px;font-weight:750;letter-spacing:.2px}.brand-mark{width:29px;height:29px;border-radius:9px;background:linear-gradient(135deg,#10a37f,#66d9b2);color:#072a20;display:grid;place-items:center;font-size:18px;font-weight:900}.icon-btn{width:35px;height:35px;border:0;border-radius:9px;background:transparent;display:grid;place-items:center;color:var(--muted);font-size:18px}.icon-btn:hover,.nav-btn:hover,.history-item:hover{background:var(--hover);color:var(--text)}.new-chat{display:flex;align-items:center;gap:10px;padding:10px 11px;border:1px solid var(--line);border-radius:10px;background:transparent;text-align:left;margin-bottom:18px}.new-chat:hover{background:var(--hover)}.nav-label{font-size:11px;color:var(--muted);font-weight:650;padding:9px 9px 5px}.nav-btn{width:100%;display:flex;align-items:center;gap:11px;padding:9px 10px;border:0;border-radius:9px;background:transparent;text-align:left;color:var(--text);font-size:13px}.nav-btn.active{background:#2b2b2b}.nav-icon{width:19px;text-align:center;color:#b7b7b7;font-size:16px}.history{overflow:auto;flex:1;min-height:50px}.history-item{padding:8px 10px;border-radius:8px;color:#c7c7c7;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}.side-bottom{padding-top:10px;border-top:1px solid var(--line)}.profile{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;cursor:pointer}.profile:hover{background:var(--hover)}.avatar{width:30px;height:30px;border-radius:50%;background:#6658a6;display:grid;place-items:center;font-size:12px;font-weight:700}.profile-info{flex:1;min-width:0}.profile-info b{display:block;font-size:12px}.profile-info small{color:var(--muted);font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;flex-shrink:0}.top-left,.top-right{display:flex;align-items:center;gap:8px}.model-select{border:0;background:transparent;padding:8px 10px;border-radius:9px;font-size:16px;font-weight:650}.model-select:hover{background:var(--hover)}.model-select span{color:var(--muted);font-weight:400}.top-action{border:1px solid var(--line);background:transparent;border-radius:20px;padding:7px 12px;font-size:12px}.top-action:hover{background:var(--hover)}.content{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:28px 22px 20px}.welcome{width:min(100%,790px);margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;padding-bottom:8vh}.welcome-mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(135deg,#10a37f,#83ddbb);display:grid;place-items:center;color:#063b2d;font-size:28px;margin-bottom:20px;box-shadow:0 8px 30px #10a37f25}.welcome h1{font-size:30px;line-height:1.2;font-weight:600;margin:0 0 28px;letter-spacing:-.8px}.composer-wrap{width:min(100%,790px);margin:0 auto 14px}.composer{background:var(--panel);border:1px solid #454545;border-radius:25px;padding:12px 14px 10px;box-shadow:var(--shadow)}.composer:focus-within{border-color:#666}.composer textarea{display:block;width:100%;min-height:48px;max-height:190px;resize:none;border:0;outline:0;background:transparent;color:var(--text);font-size:15px;padding:4px 4px 9px}.composer textarea::placeholder{color:#a1a1a1}.composer-tools{display:flex;align-items:center;justify-content:space-between;gap:10px}.tool-group{display:flex;align-items:center;gap:5px}.tool-btn{border:0;background:transparent;color:#c4c4c4;border-radius:18px;padding:7px 10px;font-size:12px}.tool-btn:hover{background:#414141}.tool-btn .plus{font-size:17px;vertical-align:-1px;margin-right:4px}.send-btn{width:34px;height:34px;border:0;border-radius:50%;background:#ececec;color:#171717;font-size:18px;font-weight:800;display:grid;place-items:center}.send-btn:disabled{opacity:.35;cursor:not-allowed}.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;width:min(100%,790px);margin-top:18px}.suggestion{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:13px;background:transparent;text-align:left;color:#d0d0d0}.suggestion:hover{background:var(--hover)}.suggestion span{font-size:18px;color:#a6a6a6}.suggestion small{display:block;color:var(--muted);font-size:11px}.messages{width:min(100%,790px);margin:0 auto;display:none;flex-direction:column;gap:23px;padding:8px 0 25px}.messages.visible{display:flex}.message{display:flex;gap:13px;align-items:flex-start}.msg-avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:#10a37f;color:#082a21;font-weight:900}.msg-body{min-width:0;flex:1;padding-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}.user-message{background:var(--panel);border-radius:20px;padding:11px 16px;max-width:85%;margin-left:auto}.assistant-message{line-height:1.7}.assistant-message .note{color:var(--muted);font-size:12px;margin-top:10px}.bottom-note{font-size:11px;color:#858585;text-align:center;margin-top:10px}.chat-mode .welcome{display:none}.chat-mode .messages{display:flex}.chat-mode .content{justify-content:flex-start}.chat-mode .composer-wrap{margin-top:auto}.page-view{display:none;width:min(100%,980px);margin:24px auto}.page-view.active{display:block}.page-view h1{font-size:27px;font-weight:600;margin:5px 0}.page-view .intro{color:var(--muted);max-width:700px;margin-bottom:23px}.page-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:1px solid var(--line);border-radius:14px;padding:17px;background:var(--panel2)}.tile-icon{font-size:21px;margin-bottom:12px}.tile h3{font-size:14px;margin:0 0 5px}.tile p{font-size:12px;color:var(--muted);margin:0}.tile button{margin-top:13px;border:0;background:transparent;color:#77cbb1;padding:0;font-size:12px}.row-card{padding:14px;border:1px solid var(--line);border-radius:12px;margin:9px 0;background:var(--panel2)}.row-card p{color:var(--muted);font-size:12px;margin:5px 0 0}.page-steps{counter-reset:n}.page-step{counter-increment:n;position:relative;border:1px solid var(--line);border-radius:12px;padding:15px 15px 15px 54px;margin:10px 0;background:var(--panel2)}.page-step:before{content:counter(n);position:absolute;left:15px;top:14px;background:#24483f;color:#9ce4c8;border-radius:8px;width:26px;height:26px;display:grid;place-items:center;font-weight:700}.page-step p{color:var(--muted);font-size:12px;margin:4px 0 0}.notice{border:1px solid #675b32;background:#302a1b;color:#e6d7a6;border-radius:10px;padding:12px;font-size:12px;margin-top:16px}.mobile-menu{display:none}.light{--bg:#fff;--sidebar:#f9f9f9;--panel:#f4f4f4;--panel2:#f7f7f7;--text:#242424;--muted:#6b6b6b;--line:#e4e4e4;--hover:#ededed;--shadow:0 8px 30px #0000000c}.light .composer{border-color:#dedede}.light .tool-btn:hover{background:#e6e6e6}.light .model-select:hover{background:#eee}.light .nav-btn.active{background:#e9e9e9}.light .send-btn{background:#222;color:white}
@media(max-width:850px){.sidebar{position:absolute;left:0;top:0;bottom:0;height:100%;box-shadow:var(--shadow)}.sidebar.collapsed{display:none}.mobile-menu{display:grid}.page-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.topbar{padding:0 10px}.content{padding:18px 13px}.welcome h1{font-size:25px}.suggestions{grid-template-columns:1fr}.page-grid{grid-template-columns:1fr}.top-action{display:none}.model-select{font-size:14px}.composer{border-radius:20px}.composer textarea{font-size:14px}.tool-btn{padding:7px 6px}.page-view{margin:15px auto}}
/* ===== Ollama integration ===== */
.dot{width:8px;height:8px;border-radius:50%;background:#888;display:inline-block;flex:none}.dot[data-s=online]{background:#19c99a;box-shadow:0 0 0 3px #19c99a22}.dot[data-s=offline]{background:#ef5b5b}.dot[data-s=checking]{background:#e0b341;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}
.model-select{display:flex;align-items:center;gap:8px;max-width:46vw}.model-select b{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-pill{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;border-radius:20px;padding:6px 11px;font-size:12px;color:var(--muted)}.status-pill:hover{background:var(--hover)}
.menu{display:none;position:absolute;top:52px;left:18px;width:min(320px,calc(100vw - 28px));max-height:70vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px;z-index:9;box-shadow:var(--shadow);font-size:13px}.menu.open{display:block}
.mm-h{display:flex;align-items:center;gap:8px;padding:9px 10px;color:var(--muted);font-size:12px}.mm-i{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;border-radius:9px;padding:9px 10px;text-align:left}.mm-i:hover,.mm-f button:hover,.mm-i.sel{background:var(--hover)}.mm-p{padding:8px 10px;color:var(--muted);font-size:12px;margin:0}.mm-f{display:flex;gap:6px;border-top:1px solid var(--line);margin-top:6px;padding-top:6px}.mm-f button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips:empty{display:none}.composer>.chips{padding:2px 2px 8px}.user-message .chips{margin-bottom:6px}.user-message{white-space:pre-wrap;overflow-wrap:anywhere}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--hover);border:1px solid var(--line);border-radius:9px;padding:3px 8px;font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chip button{border:0;background:transparent;padding:0 2px;color:var(--muted);font-size:14px}
.history-item{display:flex;align-items:center;gap:6px}.history-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.history-item.active{background:var(--hover);color:var(--text)}.hx{border:0;background:transparent;color:var(--muted);font-size:16px;padding:0 4px;border-radius:6px;opacity:0}.history-item:hover .hx,.history-item.active .hx{opacity:1}.hx:hover{color:#ef5b5b}.history-empty{padding:8px 10px;color:var(--muted);font-size:12px}@media(hover:none){.hx{opacity:.7}}
.md code{background:var(--hover);border-radius:5px;padding:1px 5px;font:12.5px ui-monospace,Menlo,Consolas,monospace}.code{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2);white-space:normal}.code-h{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--hover);font-size:12px;color:var(--muted)}.code-h button{border:0;background:transparent;color:var(--muted);font-size:12px}.code pre{margin:0;padding:12px;overflow-x:auto;white-space:pre}.code pre code{background:none;padding:0;font-size:12.5px;line-height:1.55}
.meta{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:8px;color:var(--muted);font-size:12px;white-space:normal}.meta:empty{display:none}.meta button{border:0;background:transparent;color:var(--muted);font-size:12px;padding:2px 6px;border-radius:6px}.meta button:hover{background:var(--hover);color:var(--text)}.muted{color:var(--muted)}
.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
.sys-error{border:1px solid #7a3b3b;background:#2e1c1c;color:#f0c4c4;border-radius:12px;padding:13px 15px;font-size:13px;white-space:normal}.light .sys-error{background:#fdeeee;color:#7a2020;border-color:#efc2c2}.sys-error small{display:block;opacity:.75;margin-bottom:4px}.sys-error code{font-family:ui-monospace,Menlo,monospace;font-size:12px}.sys-error .row{display:flex;gap:8px;margin-top:10px}
.genbar{display:flex;justify-content:center;margin-bottom:8px}.genbar:empty{display:none}.genbar button{border:1px solid var(--line);background:var(--panel);border-radius:20px;padding:6px 14px;font-size:12px}.genbar button:hover{background:var(--hover)}
.setup{width:min(100%,790px);margin-top:18px;text-align:left;border:1px solid #675b32;background:#302a1b;color:#e6d7a6;border-radius:13px;padding:14px 16px;font-size:13px}.setup:empty{display:none}.light .setup,.light .notice{background:#fff8e1;color:#6b5514;border-color:#ecd98f}.setup p{margin:6px 0}.setup pre{background:#0003;border-radius:9px;padding:10px 12px;overflow-x:auto;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0;white-space:pre}.light .setup pre,.light .guide{background:#0000000d}.guide{background:#0003;border-radius:9px;padding:10px 12px;overflow-x:auto;font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;margin:8px 0;white-space:pre;color:var(--text)}.setup code,.row-card code{font-family:ui-monospace,Menlo,monospace;font-size:12px}.setup .row{display:flex;gap:8px;flex-wrap:wrap}
.btn,.setup button{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:7px 12px;font-size:12px;color:var(--text)}.btn:hover,.setup button:hover{background:var(--hover)}.btn.danger{color:#ef5b5b}
.field{margin-top:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.inline{display:flex;gap:8px;flex-wrap:wrap}.inline input,.inline select,.field textarea,.field select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text);outline:0}.field textarea{width:100%;min-height:72px;resize:vertical}.field input[type=range]{width:100%;accent-color:var(--accent)}.set-status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin:6px 0}
#toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,10px);background:#111;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw}#toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.status-pill span{display:none}.status-pill{padding:8px}.menu{left:10px}}

/* Internet-connected specialist labs */
.lab-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.lab-output{border:1px solid var(--line);border-radius:12px;background:var(--panel2);padding:13px;margin-top:12px;min-height:54px;overflow-wrap:anywhere}.lab-output:empty{display:none}.lab-output table{width:100%;border-collapse:collapse;font-size:12px}.lab-output td,.lab-output th{padding:7px;border-bottom:1px solid var(--line);text-align:left}.lab-output input,.lab-output textarea,.lab-input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px;color:var(--text)}.lab-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}.lab-kpi{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}.lab-kpi b{display:block;font-size:18px}.lab-kpi small{color:var(--muted)}.integration-state{font-size:12px;color:var(--muted);margin-top:8px}.lab-output pre{white-space:pre-wrap;overflow:auto;font:12px/1.5 ui-monospace,monospace}.lab-output a{color:#79cbb3}.field-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}

.au-panel input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text);outline:0}.au-panel input:focus{border-color:var(--accent)}.au-msg:empty{display:none}
</style>
</head>
<body>

<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="side-top"><div class="brand"><div class="brand-mark">✳</div><span>AURORA</span></div><button class="icon-btn" title="Close sidebar" onclick="toggleSidebar()">☰</button></div>
  <button class="new-chat" onclick="newChat()"><span style="font-size:18px">＋</span> New chat</button>
  <nav>
    <button class="nav-btn active" data-view="chat" onclick="openView('chat')"><span class="nav-icon">✧</span> Chat</button>
    <button class="nav-btn" data-view="coding" onclick="openView('coding')"><span class="nav-icon">⌘</span> Coding studio</button>
    <button class="nav-btn" data-view="design" onclick="openView('design')"><span class="nav-icon">▧</span> Design studio</button>
    <button class="nav-btn" data-view="video" onclick="openView('video')"><span class="nav-icon">▶</span> Video studio</button>
    <button class="nav-btn" data-view="research" onclick="openView('research')"><span class="nav-icon">⌬</span> Research lab</button>
    <button class="nav-btn" data-view="data" onclick="openView('data')"><span class="nav-icon">∑</span> Data science & ML</button>
    <button class="nav-btn" data-view="robotics" onclick="openView('robotics')"><span class="nav-icon">⚙</span> Robotics & IoT</button>
    <button class="nav-btn" data-view="security" onclick="openView('security')"><span class="nav-icon">⌑</span> Cybersecurity lab</button>
    <button class="nav-btn" data-view="fintech" onclick="openView('fintech')"><span class="nav-icon">▤</span> FinTech & GIS</button>
    <button class="nav-btn" data-view="cloud" onclick="openView('cloud')"><span class="nav-icon">☁</span> Cloud & DevOps</button>
    <button class="nav-btn" data-view="fields" onclick="openView('fields')"><span class="nav-icon">▦</span> Programming fields</button>
    <button class="nav-btn" data-view="core" onclick="openView('core')"><span class="nav-icon">✳</span> AURORA Core</button>
    <button class="nav-btn" data-view="foundry" onclick="openView('foundry')"><span class="nav-icon">✺</span> AI Model Foundry</button>
    <button class="nav-btn" data-view="backend" onclick="openView('backend')"><span class="nav-icon">☁</span> Backend & account</button>
    <button class="nav-btn" data-view="deploy" onclick="openView('deploy')"><span class="nav-icon">↗</span> Deploy center</button>
  </nav>
  <div class="nav-label">YOUR WORK</div>
  <div class="history" id="history"></div>
  <div class="side-bottom">
    <button class="nav-btn" onclick="openView('agents')"><span class="nav-icon">◈</span> AI agents</button>
    <button class="nav-btn" onclick="openView('roadmap')"><span class="nav-icon">☷</span> Development roadmap</button>
    <button class="nav-btn" onclick="openView('settings')"><span class="nav-icon">⚙</span> Settings</button>
    <div class="profile" onclick="openView('settings')"><div class="avatar">A</div><div class="profile-info"><b>AURORA Workspace</b><small>Independent AI platform</small></div><span style="color:var(--muted)">···</span></div>
  </div>
</aside>
<main class="main" id="main">
  <header class="topbar">
    <div class="top-left"><button class="icon-btn mobile-menu" onclick="toggleSidebar()">☰</button><button class="model-select" id="modelBtn" onclick="toggleModelMenu(event)"><i class="dot" data-s="checking"></i><b id="modelName">AURORA</b><span>▾</span></button><div id="modelMenu" class="menu"></div></div>
    <div class="top-right"><button class="status-pill" id="statusPill" title="Ollama connection" onclick="openView('settings')"><i class="dot" data-s="checking"></i><span id="statusText">Checking…</span></button><button class="top-action" onclick="openView('roadmap')">✦ Explore workspace</button><button class="icon-btn" title="Toggle light/dark mode" onclick="toggleTheme()">☼</button></div>
  </header>
  <div class="content" id="content">
    <section class="welcome" id="welcome">
      <div class="welcome-mark">✳</div>
      <h1>What can I help you create?</h1>
      <div class="composer-wrap">
        <div class="composer"><div class="chips"></div>
          <textarea id="prompt" rows="1" placeholder="Message AURORA..." oninput="resizeInput(this)" onkeydown="handleEnter(event)"></textarea>
          <div class="composer-tools"><div class="tool-group"><button class="tool-btn" onclick="document.getElementById('fileInput').click()"><span class="plus">＋</span> Attach</button><input id="fileInput" type="file" multiple hidden onchange="handleFiles(this)"><button class="tool-btn" onclick="openView('coding')">⌘ Code</button><button class="tool-btn" onclick="openView('design')">▧ Design</button></div><div class="tool-group"><button class="tool-btn" onclick="toast('Voice input is not enabled in this build.')">♩</button><button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button></div></div>
        </div>
        <div class="bottom-note">AURORA can make mistakes. Verify important information and review generated work.</div><div class="bottom-note" id="connNote"></div>
      </div>
      <div id="setup"></div>
      <div class="suggestions">
        <button class="suggestion" onclick="useSuggestion('Build a responsive website with a modern dashboard and authentication.')"><span>⌘</span><div>Build an application<small>Plan and generate a software project</small></div></button>
        <button class="suggestion" onclick="useSuggestion('Create a complete visual identity with a logo direction, color palette and typography.')"><span>✧</span><div>Create a design<small>Branding, graphics and UI/UX</small></div></button>
        <button class="suggestion" onclick="useSuggestion('Create a video script and storyboard for a cinematic product advertisement.')"><span>▶</span><div>Make a video<small>Script, storyboard and production plan</small></div></button>
        <button class="suggestion" onclick="useSuggestion('Explain how to build and evaluate a machine learning model for a real-world problem.')"><span>⌬</span><div>Explore AI research<small>Machine learning and data science</small></div></button>
      </div>

<script>
const pageContent={
core:`<div class="page-view"><div class="eyebrow">AURORA INTELLIGENCE PLATFORM</div><h1>AURORA Core</h1><p class="intro">AURORA's identity, persistent workspace memory, model runtime and controlled improvement loop. The core can use open-weight models today and grow into a family of AURORA-owned specialist models through reviewed fine-tuning.</p>
<div class="page-grid"><div class="tile"><div class="tile-icon">✳</div><h3>Core runtime</h3><p id="acRuntimeState">Checking backend…</p></div><div class="tile"><div class="tile-icon">▤</div><h3>Persistent memory</h3><p id="acMemoryCount">0 saved memories on this device</p></div><div class="tile"><div class="tile-icon">⚒</div><h3>Improvement dataset</h3><p id="acEvalCount">0 reviewed examples</p></div></div>
<div class="row-card"><b>1. AURORA identity & operating principles</b><p>AURORA is the coordinating AI system. It can route work to different open models and specialist adapters; model identity is not the same as training a new foundation model.</p><div class="notice">AURORA Core is an orchestration and memory layer. The actual model generates responses through the selected runtime. Specialist fine-tuning is managed in AI Model Foundry.</div><div class="inline"><button class="btn primary" onclick="acCheckRuntime()">Check real runtime</button><button class="btn" onclick="openView('foundry')">Open Model Foundry</button><button class="btn" onclick="openView('backend')">Backend settings</button></div><div id="acRuntimeDetails" class="lab-output"></div></div>
<div class="row-card"><b>2. Persistent AURORA memory</b><p>Add facts, project context or instructions that you explicitly want AURORA to use in future chats on this browser. Memory is stored locally on this device and included in model context; it is not automatically used for model training.</p><div class="field"><label>Memory title</label><input id="acMemTitle" placeholder="e.g. My AURORA project goals"></div><div class="field"><label>Memory content</label><textarea id="acMemContent" rows="3" placeholder="Write information AURORA should remember…"></textarea></div><button class="btn primary" onclick="acSaveMemory()">Save memory on this device</button><div id="acMemoryList" class="lab-output"></div></div>
<div class="row-card"><b>3. Reviewed examples for improvement</b><p>Save a prompt and a reviewed ideal answer. These examples are a curated dataset, not automatic learning. Export them as JSONL and use a compatible dataset in the Foundry after checking rights and quality.</p><div class="field"><label>Example prompt</label><textarea id="acEvalPrompt" rows="2" placeholder="What did the user ask?"></textarea></div><div class="field"><label>Reviewed ideal answer</label><textarea id="acEvalAnswer" rows="3" placeholder="Enter the answer you want a specialist model to learn from…"></textarea></div><div class="inline"><button class="btn primary" onclick="acSaveExample()">Add reviewed example</button><button class="btn" onclick="acExportExamples()">Export JSONL dataset</button></div><div id="acExamplesList" class="lab-output"></div></div>
<div class="row-card"><b>4. Controlled evolution cycle</b><div class="page-steps"><div class="page-step"><b>Collect with permission</b><p>Use authorized documents, feedback and reviewed examples. Do not ingest private data without permission.</p></div><div class="page-step"><b>Curate & deduplicate</b><p>Remove personal secrets, low-quality examples, duplicates and unsafe instructions.</p></div><div class="page-step"><b>Evaluate a baseline</b><p>Keep a fixed test set and record accuracy, usefulness, safety and regression results.</p></div><div class="page-step"><b>Fine-tune a specialist</b><p>Use AI Model Foundry for a real compatible cloud training job after reviewing compute charges and licenses.</p></div><div class="page-step"><b>Test before activation</b><p>Compare the candidate against the baseline, then explicitly publish and configure the approved model in the backend runtime.</p></div></div><div class="notice">No background self-training is running. AURORA will not silently train on chat history. This prevents uncontrolled model drift and accidental use of private conversations.</div></div></div>`,
backend:`<div class="page-view"><div class="eyebrow">SECURE SERVER CONNECTION</div><h1>Backend & account</h1><p class="intro">Connect AURORA to your FastAPI server. Store provider keys on the server, use the protected AI gateway, save projects and upload files.</p><div class="row-card"><b>1. API server</b><div class="field"><label>Backend URL</label><input id="backendUrl" placeholder="https://your-api-domain.com" value=""></div><div class="inline"><button class="btn primary" onclick="backendHealth()">Test server</button><span id="backendHealthState" class="integration-state">Not checked</span></div></div><!--AUROR--><div class="row-card"><b>4. AI provider — secure key vault</b><div class="field"><label>Provider base URL</label><input id="backendProviderUrl" value="https://openrouter.ai/api/v1" placeholder="https://openrouter.ai/api/v1"></div><div class="field"><label>Model ID (from provider)</label><input id="backendModel" placeholder="e.g. openai/gpt-4o-mini"></div><div class="field"><label>Provider API key</label><input id="backendProviderKey" type="password" autocomplete="off" placeholder="Key is sent to the backend and encrypted at rest"></div><div class="inline"><button class="btn primary" onclick="backendSaveProvider()">Save key securely</button><button class="btn" onclick="backendLoadProvider()">Load saved settings</button></div><p class="integration-state">The key is encrypted by the server and is not saved in AURORA browser storage. Configure a strong ENCRYPTION_KEY on your server.</p></div><div class="row-card"><b>5. Enable secure AI gateway</b><p>When enabled, AURORA sends chat prompts through your authenticated backend. The provider key stays on the server.</p><div class="inline"><button class="btn primary" onclick="backendToggle(true)">Use secure backend for AI</button><button class="btn" onclick="backendToggle(false)">Use direct provider mode</button><button class="btn" onclick="backendModels()">Fetch models</button></div><p id="backendModeState" class="integration-state">Direct provider mode</p></div><div class="row-card"><b>6. Cloud projects & files</b><p>Projects are stored per account in the backend database. Uploads are private to your account and saved to the server's uploads directory by default.</p><div class="inline"><button class="btn" onclick="backendProjects()">Load my projects</button><button class="btn" onclick="backendListFiles()">List my files</button><input id="backendProjectName" placeholder="Project name"><button class="btn" onclick="backendSaveProject()">Save current chat as project</button><input id="backendFile" type="file"><button class="btn" onclick="backendUpload()">Upload file</button></div><div id="backendResults" class="lab-output"></div></div><div class="row-card"><b>7. Machine-learning API</b><p>Send a small numeric dataset to the authenticated regression endpoint and receive real scikit-learn train/test metrics.</p><div class="field"><label>CSV data (first row is column names)</label><textarea id="backendCsv" rows="5" placeholder="year,gdp,inflation\n2019,100,5.2\n2020,105,6.1\n..."></textarea></div><div class="field"><label>Target column</label><input id="backendTarget" placeholder="gdp"></div><div class="field"><label>Predictor columns (comma-separated)</label><input id="backendFeatures" placeholder="year,inflation"></div><button class="btn primary" onclick="backendTrainML()">Train regression model</button><div id="backendMLResult" class="lab-output"></div></div><div class="notice"><b>Deployment note:</b> this package is a deployable starter backend, not an already-hosted server. Deploy it to a VPS/cloud host, set environment secrets, configure HTTPS and CORS, then paste its URL above. Local uploads use server disk; S3-compatible settings are included as a deployment extension, but an object-storage bucket must be provisioned before using it.</div></div>`,
coding:`<div class="page-view"><div class="eyebrow">AURORA WORKSPACE</div><h1>Coding studio</h1><p class="intro">Plan, create, test and improve software with a coordinated team of specialist agents.</p><div class="page-grid"><div class="tile"><div class="tile-icon">⌘</div><h3>Project architect</h3><p>Requirements, architecture, folder structures and technical decisions.</p></div><div class="tile"><div class="tile-icon">⌨</div><h3>Code builder</h3><p>Frontend, backend, APIs, databases and mobile applications.</p></div><div class="tile"><div class="tile-icon">⚒</div><h3>Debug & testing</h3><p>Run tests, diagnose errors and review proposed fixes.</p></div></div><div class="notice">Production requirement: execute generated code in isolated, resource-limited sandboxes. This prototype does not execute code.</div></div>`,
design:`<div class="page-view"><div class="eyebrow">AURORA WORKSPACE</div><h1>Design studio</h1><p class="intro">Create a cohesive visual identity, polished interfaces and professional graphic assets.</p><div class="page-grid"><div class="tile"><div class="tile-icon">✧</div><h3>Brand designer</h3><p>Logo concepts, typography, color systems and brand guidelines.</p></div><div class="tile"><div class="tile-icon">▦</div><h3>UI/UX designer</h3><p>User journeys, wireframes, responsive layouts and accessibility.</p></div><div class="tile"><div class="tile-icon">▧</div><h3>Image creator</h3><p>Image generation workflows, posters, banners and social graphics.</p></div></div><div class="notice">Connect an appropriately licensed open image model and GPU worker for live generation.</div></div>`,
video:`<div class="page-view"><div class="eyebrow">AURORA WORKSPACE</div><h1>Video studio</h1><p class="intro">Move from idea to script, storyboard, edit plan, captions, audio and rendered video.</p><div class="page-grid"><div class="tile"><div class="tile-icon">✎</div><h3>Script & storyboard</h3><p>Write scenes, narration, shot lists and visual direction.</p></div><div class="tile"><div class="tile-icon">◉</div><h3>Media generation</h3><p>Prepare visual assets and connect suitable generative models.</p></div><div class="tile"><div class="tile-icon">♫</div><h3>Editor & narration</h3><p>Assemble timelines, audio, subtitles and exports.</p></div></div><div class="notice">Video generation is GPU-intensive. Start with script, storyboard and FFmpeg editing workflows.</div></div>`,
research:`<div class="page-view"><div class="eyebrow">AURORA WORKSPACE</div><h1>AI research lab</h1><p class="intro">Experiment with open-weight models, machine learning, data and reproducible evaluations.</p><div class="row-card"><b>Language models</b><p>Local inference, retrieval-augmented generation and fine-tuning.</p></div><div class="row-card"><b>Machine learning</b><p>Data preparation, training, validation and experiment tracking.</p></div><div class="row-card"><b>Computer vision & audio</b><p>Image understanding, speech recognition and synthesis.</p></div></div>`,
deploy:`<div class="page-view"><div class="eyebrow">AURORA WORKSPACE</div><h1>Deploy center</h1><p class="intro">Prepare reliable releases with automated checks, staging and explicit approval.</p><div class="page-steps"><div class="page-step"><b>Build artifacts</b><p>Compile the frontend, backend and application packages.</p></div><div class="page-step"><b>Run quality gates</b><p>Tests, accessibility, dependency and security checks.</p></div><div class="page-step"><b>Deploy preview</b><p>Publish to a staging environment for review.</p></div><div class="page-step"><b>Approve and publish</b><p>Deploy to authorized hosting targets with rollback available.</p></div></div><div class="notice">No deployment credentials are connected. Production publishing must require explicit authorization.</div></div>`,
agents:`<div class="page-view"><div class="eyebrow">ORCHESTRATION</div><h1>AI agents</h1><p class="intro">Specialist roles coordinated by a central orchestrator. Agents initially share open-weight models with different instructions and tool permissions.</p>${[['◈','Orchestrator','Plans tasks and coordinates specialist agents.'],['⌘','Software architect','Designs system structure and technical decisions.'],['⌨','Frontend engineer','Builds responsive, accessible user interfaces.'],['⚙','Backend engineer','Creates APIs, authentication and business logic.'],['▤','Database engineer','Designs schemas, migrations and backups.'],['⚒','QA engineer','Writes tests and verifies fixes.'],['✧','UI/UX designer','Creates user flows and visual systems.'],['▧','Image artist','Plans and manages image generation.'],['▶','Video producer','Plans scripts, scenes, captions and edits.'],['⌬','ML researcher','Evaluates models and experiments.'],['🛡','Security reviewer','Checks permissions, dependencies and secrets.'],['↗','Release engineer','Builds and deploys with approval.']].map(a=>`<div class="row-card"><b>${a[0]} &nbsp; ${a[1]}</b><p>${a[2]}</p></div>`).join('')}</div>`,
roadmap:`<div class="page-view"><div class="eyebrow">IMPLEMENTATION PLAN</div><h1>Development roadmap</h1><p class="intro">Build a dependable core first, then add creative and model-training capabilities.</p><div class="page-steps"><div class="page-step"><b>Phase 1 — Foundation</b><p>Authentication, projects, files, database, API and responsive dashboard.</p></div><div class="page-step"><b>Phase 2 — AI core & coding</b><p>Open model gateway, orchestrator, coding agents and sandboxed execution.</p></div><div class="page-step"><b>Phase 3 — Design studio</b><p>Design systems, asset library and image-model integration.</p></div><div class="page-step"><b>Phase 4 — Video studio</b><p>Scripts, storyboards, audio, subtitles and rendering queue.</p></div><div class="page-step"><b>Phase 5 — Testing & deployment</b><p>CI/CD, staging, security gates, approvals and rollback.</p></div><div class="page-step"><b>Phase 6 — Own models</b><p>Open-weight base models, permissioned datasets, benchmarks, specialist fine-tuning and controlled model releases.</p></div></div></div>`
};
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KS='aurora.settings.v2',KC='aurora.chats.v2',els=new WeakMap();

const AURORA_API_URL='';
let backendCfg={url:'http://127.0.0.1:8000',token:'',use:false};try{const savedBackend=JSON.parse(localStorage.getItem('aurora.backend.v1')||'{}');backendCfg={...backendCfg,...savedBackend};const sessionToken=localStorage.getItem('aurora.backend.token')||savedBackend.token||'';backendCfg.token=sessionToken;if(sessionToken)localStorage.setItem('aurora.backend.token',sessionToken);if(savedBackend.token){delete savedBackend.token;localStorage.setItem('aurora.backend.v1',JSON.stringify(savedBackend))}}catch{}

function saveBackendCfg(){const safe={url:backendCfg.url,use:!!backendCfg.use};localStorage.setItem('aurora.backend.v1',JSON.stringify(safe));if(backendCfg.token)localStorage.setItem('aurora.backend.token',backendCfg.token);else localStorage.removeItem('aurora.backend.token')}
let S={...D},chats=[],cur=null,chatStarted=false,pending=[],models=[],streaming=false,streamMsg=null,abortC=null,notice=null,raf=0,curView='chat',conn={s:'checking',v:'',err:''};
/* ---------- AURORA Core: explicit local memory and reviewed examples ---------- */
const ACM='aurora.core.memory.v1',ACE='aurora.core.examples.v1';
function acRead(k){try{const v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[]}catch{return[]}}

function acSaveMemory(){const title=$('acMemTitle')?.value.trim(),content=$('acMemContent')?.value.trim();if(!title||!content)return toast('Enter a memory title and content.');const a=acMemories();a.unshift({id:Date.now(),title,content,created_at:new Date().toISOString()});if(!acWrite(ACM,a))return;$('acMemTitle').value='';$('acMemContent').value='';acRender();toast('Memory saved on this device')}

function acSaveExample(){const prompt=$('acEvalPrompt')?.value.trim(),answer=$('acEvalAnswer')?.value.trim();if(!prompt||!answer)return toast('Enter both the prompt and reviewed answer.');const a=acExamples();a.unshift({prompt,answer,created_at:new Date().toISOString()});if(!acWrite(ACE,a))return;$('acEvalPrompt').value='';$('acEvalAnswer').value='';acRender();toast('Reviewed example saved')}

function acExportExamples(){const a=acExamples();if(!a.length)return toast('Add reviewed examples first.');const lines=a.map(x=>JSON.stringify({messages:[{role:'user',content:x.prompt},{role:'assistant',content:x.answer}]})).join('\n');const u=URL.createObjectURL(new Blob([lines+'\n'],{type:'application/jsonl'}));const el=document.createElement('a');el.href=u;el.download='aurora-reviewed-training-examples.jsonl';el.click();setTimeout(()=>URL.revokeObjectURL(u),1200);toast('Reviewed examples exported as JSONL')}
function acRender(){const m=acMemories(),e=acExamples();const mc=$('acMemoryCount'),ec=$('acEvalCount'),ml=$('acMemoryList'),el=$('acExamplesList');if(mc)mc.textContent=m.length+' saved memories on this device';if(ec)ec.textContent=e.length+' reviewed examples';if(ml)ml.innerHTML=m.length?m.map(x=>'<div class="row-card"><b>'+esc(x.title)+'</b><p style="white-space:pre-wrap">'+esc(x.content)+'</p><button class="btn danger" onclick="acDeleteMemory('+Number(x.id)+')">Delete</button></div>').join(''):'<p>No saved memories yet.</p>';if(el)el.innerHTML=e.length?e.slice(0,8).map((x,i)=>'<div class="row-card"><b>Example '+(i+1)+'</b><p><b>Prompt:</b> '+esc(x.prompt.slice(0,220))+'</p><p><b>Reviewed answer:</b> '+esc(x.answer.slice(0,260))+'</p><button class="btn danger" onclick="acDeleteExample('+i+')">Delete</button></div>').join(''):'<p>No reviewed examples yet.</p>'}
async function acCheckRuntime(){const state=$('acRuntimeState'),out=$('acRuntimeDetails');if(state)state.textContent='Checking…';try{const h=await backendRequest('/health');let msg='Backend reachable · '+(h.status||'healthy');if(backendCfg.token){const r=await fetch(backendBase()+'/ai/native/models',{headers:{Authorization:'Bearer '+backendCfg.token}});if(!r.ok)throw new Error('Backend health is OK, but model runtime returned HTTP '+r.status);const j=await r.json();const names=(j.data||[]).map(x=>x.id).filter(Boolean);msg+=' · '+names.length+' native model(s)';}else msg+=' · sign-in required to inspect private model runtime';if(state)state.textContent=msg;if(out)out.textContent=msg+'\nThis check reports the server response; it does not assume a model is installed.'}catch(e){if(state)state.textContent='Unavailable';if(out)out.textContent=e.message}}

function copyText(t){return(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).catch(()=>{const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();if(!ok)throw 0}).then(()=>toast('Copied'),()=>toast('Copy failed'))}

function toggleSidebar(){$('sidebar').classList.toggle('collapsed')}

function toggleTheme(){S.theme=S.theme==='light'?'dark':'light';applyTheme();saveS()}
function closeMenu(){$('modelMenu').classList.remove('open')}
function toggleModelMenu(e){e.stopPropagation();$('modelMenu').classList.toggle('open')}
function renderMd(t){return t.split('```').map((p,i)=>{if(i%2){const m=p.match(/^([\w+#.-]*)\n/),lang=m?m[1]:'',code=m?p.slice(m[0].length):p;return`<div class="code"><div class="code-h"><span>${esc(lang||'code')}</span><span>${/^html?$/i.test(lang)||/^\s*<(!doctype|html)/i.test(code)?'<button onclick="openCode(this)">▶ Open</button> <button onclick="saveCode(this)">Save index.html</button> ':''}<button onclick="copyCode(this)">Copy</button></span></div><pre><code>${esc(code.replace(/\n$/,''))}</code></pre></div>`}return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}).join('')}

/* ---------- Ollama connection ---------- */
const ep=()=>S.endpoint.replace(/\/+$/,'');

const PRESETS={aurora:{label:'AURORA AI (built-in)',type:'openai',url:''},ollama:{label:'Ollama (local)',type:'ollama',url:'http://localhost:11434'},lmstudio:{label:'LM Studio (local)',type:'openai',url:'http://localhost:1234/v1'},ollamacloud:{label:'Ollama cloud',type:'ollama',url:'https://ollama.com'},openrouter:{label:'OpenRouter',type:'openai',url:'https://openrouter.ai/api/v1'},groq:{label:'Groq',type:'openai',url:'https://api.groq.com/openai/v1'},together:{label:'Together AI',type:'openai',url:'https://api.together.xyz/v1'},openai:{label:'OpenAI',type:'openai',url:'https://api.openai.com/v1'},gemini:{label:'Google Gemini',type:'openai',url:'https://generativelanguage.googleapis.com/v1beta/openai'},customoa:{label:'Custom (OpenAI-compatible)',type:'openai',url:''},customol:{label:'Custom Ollama server',type:'ollama',url:''}};

function dpGates(){const h=built||dpSrc();if(!h)return;const d=new DOMParser().parseFromString(h,'text/html'),ch=[['Has a doctype',/^\s*<!doctype html/i.test(h)],['Has a lang attribute',!!d.documentElement.getAttribute('lang')],['Has a title',!!(d.title||'').trim()],['Has a viewport meta tag',!!d.querySelector('meta[name=viewport]')],['Images have alt text',![...d.images].some(i=>!i.hasAttribute('alt'))],['No hard-coded secrets',!/(sk-[a-z0-9_-]{16,}|AKIA[0-9A-Z]{12,}|ghp_[A-Za-z0-9]{20,}|api[_-]?key\s*[:=]\s*['"][^'"]{12,})/i.test(h)],['No insecure http:// resources',![...d.querySelectorAll('[src],link[href]')].some(e=>/^http:\/\//i.test(e.getAttribute('src')||e.getAttribute('href')))],['Under 1 MB',h.length<1e6]];lg(ch.map(c=>(c[1]?'✓ ':'✗ ')+c[0]).join('<br>')+'<br><br><b>'+ch.filter(c=>c[1]).length+'/'+ch.length+' checks passed</b>');return ch.every(c=>c[1])}

function secPassword(){const p=$('secPass').value;if(!p)return toast('Enter a test string. Do not use a real password.');let pool=0;if(/[a-z]/.test(p))pool+=26;if(/[A-Z]/.test(p))pool+=26;if(/[0-9]/.test(p))pool+=10;if(/[^A-Za-z0-9]/.test(p))pool+=33;const bits=p.length*Math.log2(Math.max(pool,1)),grade=bits<28?'Very weak':bits<36?'Weak':bits<60?'Moderate':bits<80?'Strong':'Very strong';labSet('security',`<b>Estimated entropy: ${bits.toFixed(1)} bits · ${grade}</b><p class="muted">This is a rough educational estimate, not a password-audit guarantee. Avoid dictionary words, reuse and personal information.</p>`)}
async function secHash(){try{const p=$('secPass').value;if(!p)throw new Error('Enter sample text first.');const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(p));labSet('security','<b>SHA-256 digest</b><pre>'+[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')+'</pre>')}catch(e){labErr('security',e)}}
async function secDns(type){try{const d=$('secDomain').value.trim().replace(/^https?:\/\//,'').split('/')[0];if(!/^[a-z0-9.-]+$/i.test(d))throw new Error('Enter a valid domain name.');const j=await labFetch('https://dns.google/resolve?name='+encodeURIComponent(d)+'&type='+type);labSet('security','<b>DNS '+type+' results for '+esc(d)+'</b><pre>'+esc(JSON.stringify(j.Answer||j,null,2))+'</pre>')}catch(e){labErr('security',e)}}
async function secHeaders(){try{let u=$('secUrl').value.trim();if(!/^https:\/\//i.test(u))throw new Error('Enter a valid HTTPS URL.');const r=await fetch(u,{method:'HEAD',mode:'cors'});const names=['strict-transport-security','content-security-policy','x-content-type-options','x-frame-options','referrer-policy','permissions-policy'];labSet('security','<b>Accessible response headers · '+r.status+'</b><table>'+names.map(n=>`<tr><td>${n}</td><td>${esc(r.headers.get(n)||'Not exposed / not present')}</td></tr>`).join('')+'</table><p class="muted">A browser cannot distinguish missing headers from headers hidden by CORS. This is not a complete security audit.</p>')}catch(e){labErr('security',new Error('Browser could not inspect this host. It may block CORS or HEAD requests. Use a server-side scanner for complete checks. '+e.message))}}

/* ---------- authenticated FastAPI backend ---------- */
function backendBase(){const v=(backendCfg.url||'').trim().replace(/\/$/,'');if(!/^https?:\/\//i.test(v))throw new Error('Enter a complete backend URL beginning with https:// or http://');return v}
async function backendRequest(path,opts={}){const h={...(opts.headers||{})};if(backendCfg.token)h.Authorization='Bearer '+backendCfg.token;const base=backendBase();const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),65000);let r;try{r=await fetch(base+path,{...opts,headers:h,signal:ac.signal})}catch(err){clearTimeout(tm);const org=location.origin==='null'||location.protocol==='file:'?'a local file (file://)':location.origin;if(err.name==='AbortError')throw new Error('The server at '+base+' did not respond in time. If it is on a free host (e.g. Render) it may be waking up - wait a minute and try again.');throw new Error('Cannot reach the backend at '+base+'. Check that: (1) the URL is correct and the server is deployed and running (open '+base+'/health in a new tab - it should show a status); (2) the server allows this page ('+org+') in its CORS allowed origins; (3) you are using https:// (not http://) unless it is localhost.')}clearTimeout(tm);const raw=await r.text();let j={};try{j=raw?JSON.parse(raw):{}}catch{j={detail:raw}}if(!r.ok)throw new Error(j.detail||j.message||('HTTP '+r.status));return j}
function backendPageSync(){auSync();const u=$('backendUrl');if(u)u.value=backendCfg.url;const st=$('backendAccountState');if(st)st.textContent=backendCfg.token?'Signed in · authenticated server session':'Not signed in';const mode=$('backendModeState');if(mode)mode.textContent=backendCfg.use?'Secure backend mode is ON':'Direct provider mode is ON';}
async function backendHealth(){try{backendCfg.url=($('backendUrl')?.value||backendCfg.url).trim().replace(/\/$/,'');saveBackendCfg();const j=await backendRequest('/health');$('backendHealthState').textContent='Connected · '+j.status;toast('AURORA backend is reachable')}catch(e){if($('backendHealthState'))$('backendHealthState').textContent='Connection failed · '+e.message;toast(e.message)}}
async function backendSaveProvider(){try{const j=await backendRequest('/settings/provider',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({base_url:$('backendProviderUrl').value.trim(),model:$('backendModel').value.trim(),api_key:$('backendProviderKey').value.trim()})});$('backendProviderKey').value='';toast('Provider key encrypted and stored on server');$('backendModeState').textContent='Provider saved · '+j.model}catch(e){toast(e.message)}}
async function backendLoadProvider(){try{const j=await backendRequest('/settings/provider');if(!j.configured)throw new Error('No provider configuration saved yet');$('backendProviderUrl').value=j.base_url;$('backendModel').value=j.model;$('backendProviderKey').value='';toast('Saved provider settings loaded; key remains hidden')}catch(e){toast(e.message)}}
function backendToggle(on){if(on&&!backendCfg.token){toast('Sign in to your backend first');return}backendCfg.use=!!on;saveBackendCfg();backendPageSync();if(on)refreshModels();else{conn.s='checking';renderConn();refreshModels()}toast(on?'Secure backend AI gateway enabled':'Direct provider mode enabled')}
async function backendModels(){try{const j=await backendRequest('/ai/models');models=chatModels((j.data||[]).map(x=>x.id).filter(Boolean));if(!models.includes(S.model))S.model=models[0]||'';renderConn();toast('Loaded '+models.length+' models from backend')}catch(e){toast(e.message)}}
async function backendProjects(){try{const a=await backendRequest('/projects');$('backendResults').innerHTML='<b>'+a.length+' saved project(s)</b>'+a.map(x=>'<p>'+esc(x.name)+' — '+esc(x.description||'')+'</p>').join('')||'No projects yet'}catch(e){toast(e.message)}}
async function backendSaveProject(){try{if(!cur)throw new Error('Start a chat first');const name=$('backendProjectName').value.trim()||cur.title||'AURORA project';const j=await backendRequest('/projects',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,description:'Saved from AURORA chat',content:{chat:cur}})});toast('Project saved to server · ID '+j.id);backendProjects()}catch(e){toast(e.message)}}
async function backendListFiles(){try{const a=await backendRequest('/files');$('backendResults').innerHTML='<b>'+a.length+' private file(s)</b>'+a.map(x=>'<p>'+esc(x.filename)+' · '+Number(x.size).toLocaleString()+' bytes · <button class=\"btn\" onclick=\"backendDownload(\''+esc(x.id)+'\')\">Download</button></p>').join('')}catch(e){toast(e.message)}}
async function backendDownload(id){try{const r=await fetch(backendBase()+'/files/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+backendCfg.token}});if(!r.ok)throw new Error('Download failed · HTTP '+r.status);const blob=await r.blob(),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='aurora-file';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}catch(e){toast(e.message)}}
async function backendUpload(){try{const f=$('backendFile').files[0];if(!f)throw new Error('Choose a file first');const fd=new FormData();fd.append('file',f);const j=await backendRequest('/files/upload',{method:'POST',body:fd});$('backendResults').insertAdjacentHTML('afterbegin','<p>Uploaded: '+esc(j.filename)+' · '+Number(j.size).toLocaleString()+' bytes · private server storage</p>');toast('File uploaded')}catch(e){toast(e.message)}}
function backendCsvRows(raw){const lines=raw.trim().split(/\r?\n/).filter(Boolean);if(lines.length<13)throw new Error('Paste a header and at least 12 data rows');const split=l=>l.split(',').map(x=>x.trim());const headers=split(lines[0]);return lines.slice(1).map(l=>{const vals=split(l),o={};headers.forEach((h,i)=>{const v=vals[i]??'';o[h]=v!==''&&!Number.isNaN(Number(v))?Number(v):v});return o})}
async function backendTrainML(){try{const rows=backendCsvRows($('backendCsv').value),target=$('backendTarget').value.trim(),features=$('backendFeatures').value.split(',').map(x=>x.trim()).filter(Boolean);const j=await backendRequest('/ml/linear-regression',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rows,target,features})});$('backendMLResult').innerHTML='<b>Linear Regression · '+esc(j.observations)+' observations</b><div class="lab-kpis">'+Object.entries(j.metrics).map(([k,v])=>'<div class="lab-kpi"><b>'+Number(v).toFixed(4)+'</b><small>'+esc(k.toUpperCase())+'</small></div>').join('')+'</div><p>Train rows: '+j.train_rows+' · Test rows: '+j.test_rows+'</p><p class="muted">'+esc(j.note)+'</p>'}catch(e){$('backendMLResult').textContent=e.message}}

pr.forEach(k=>{const l=k.toLowerCase();b[k]=/pass/.test(l)?c.password:/mail/.test(l)?c.email:/^(user|username|login)$/.test(l)?(kind==='login'?c.email:nm):/name/.test(l)?nm:std[k]});const j=await go(p,pr.length?b:std,form);if(j)return j}}catch(e){if(e.message&&!/JSON|fetch|Unexpected/i.test(e.message))throw e}

throw new Error('No '+(kind==='register'?'account-creation':'sign-in')+' route found. Probed '+cand.length+' common paths ('+ds.join(', ')+'). Open "Advanced: custom auth routes" below and enter your server\'s real route, or the backend has no auth endpoints yet.')}
function auroraSaveRoutes(){const n=v=>{v=(v||'').trim();return v&&!v.startsWith('/')?'/'+v:v};const o={login:n(($('auRteLoginS')||$('auRteLoginB')||{}).value),register:n(($('auRteRegS')||$('auRteRegB')||{}).value)};try{localStorage.setItem('aurora.auth.routes',JSON.stringify(o))}catch{}auMsg('Custom routes saved: '+(o.login||'auto')+' / '+(o.register||'auto'));toast('Auth routes saved')}
async function auroraSign(mode,c){try{const{email,password,name}=auroraRead(c);if(!email||!password)throw new Error('Enter your email and password.');auMsg(mode==='register'?'Creating account…':'Signing in…');const pl={email,password,name};let j=await auroraCall(mode==='register'?'register':'login',pl);let tok=j.access_token||j.token||j.jwt;if(!tok&&mode==='register'){j=await auroraCall('login',pl);tok=j.access_token||j.token||j.jwt}if(!tok)throw new Error('The server did not return a session token.');backendCfg.token=tok;saveBackendCfg();document.querySelectorAll('[id^=auPass]').forEach(x=>x.value='');auSync();if(isAurora())await auroraConnect(c);else{auMsg('Signed in. Choose AURORA AI (built-in) as the provider to chat with it.');backendPageSync()}}catch(e){auMsg(e.message,true);toast(e.message)}}
function auroraSignOut(){backendCfg.token='';saveBackendCfg();models=[];if(isAurora())conn={s:'offline',v:'',err:'signed out'};renderConn();backendPageSync();auMsg('Signed out.');toast('Signed out')}
async function auroraConnect(c){S.preset='aurora';S.endpoint='';S.apiKey='';saveS();const sp=$('setPreset');if(sp)sp.value='aurora';try{if(c)auroraRead(c)}catch(e){auMsg(e.message,true);return toast(e.message)}conn={s:'checking',v:'',err:''};renderConn();auMsg('Checking server…');
try{try{await backendRequest('/health')}catch(e){if(/^(Cannot reach|The server at)/.test(e.message))throw e}
if(!backendCfg.token){conn={s:'offline',v:'',err:'sign in required'};renderConn();auMsg('Server reachable. Sign in (or create an account) to finish connecting.');return toast('Server reachable — sign in to finish connecting'),false}
await refreshModels();if(conn.s!=='online'){auMsg(conn.err||'Could not reach the AURORA model runtime.',true);return toast(conn.err||'AURORA runtime unavailable'),false}
if(!models.length){auMsg('Signed in, but the model runtime returned no models. Start the inference service on the server.',true);return toast('Connected, but no models available'),false}
auMsg('Connected. Model: '+S.model);toast('AURORA AI connected · '+S.model);return true}catch(e){models=[];conn={s:'offline',v:'',err:e.message};renderConn();auMsg(e.message,true);toast(e.message);return false}}
{const _b=pageContent.backend;Object.defineProperty(pageContent,'backend',{get:()=>_b.replace('<!--AUROR-->','<div class="row-card"><b>2. Account</b><p>Sign in to your AURORA account. The session is kept in this browser until you sign out or it expires.</p><p id="backendAccountState" class="integration-state">Not signed in</p>'+auroraPanelHTML('B',true)+'</div><div class="row-card"><b>3. Built-in AURORA AI</b><p>Use the model runtime managed by your AURORA server. No provider key or endpoint is needed.</p><div class="inline"><button class="btn primary" onclick="auroraConnect(\'B\')">Connect built-in AURORA AI</button><button class="btn" onclick="auroraTest()">Test generation</button></div></div>'),configurable:true,enumerable:true})}
