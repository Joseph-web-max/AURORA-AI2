
services:
  - type: web
    name: aurora-ai-backend
    runtime: python
    plan: free

    buildCommand: pip install -r backend/requirements.txt

    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7

      - key: JWT_SECRET
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: AURORA_MODEL_BASE_URL
        sync: false

      - key: AURORA_MODEL_API_KEY
        sync: false

      - key: AURORA_MODEL_NAME
        sync: false

      - key: AURORA_ALLOWED_ORIGINS
        value: "*"
